name: Publish live judge build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forkroom-live
  cancel-in-progress: true

jobs:
  publish:
    name: Verify, build, and publish live branch
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit WebMCP contract
        run: node scripts/validate-webmcp.mjs

      - name: Lint
        run: npm run lint

      - name: Run deterministic tests
        run: npm test -- --reporter=verbose

      - name: Build portable static app
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Verify portable artifact
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          grep -R -q 'registerTool' dist/assets/*.js
          test -s dist/.well-known/webmcp.json
          test -s dist/llms.txt

      - name: Publish immutable contents to live branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -a dist/. "$staging/"
          printf '%s\n' "$SOURCE_SHA" > "$staging/SOURCE_COMMIT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan live
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$staging/." .
          git add -A
          git commit -m "deploy: ${SOURCE_SHA}"
          git push --force origin HEAD:live
