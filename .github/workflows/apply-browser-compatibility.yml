name: Apply verified WebMCP compatibility

on:
  push:
    branches: [compat-v1.0.2]
    paths:
      - scripts/apply-browser-compatibility.py
      - .github/workflows/apply-browser-compatibility.yml

permissions:
  contents: write

concurrency:
  group: forkroom-compat-v1.0.2
  cancel-in-progress: true

jobs:
  migrate:
    name: Patch, verify, and commit cross-version support
    runs-on: ubuntu-24.04
    steps:
      - name: Check out compatibility branch
        uses: actions/checkout@v6
        with:
          ref: compat-v1.0.2
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply deterministic migration
        run: python scripts/apply-browser-compatibility.py

      - name: Verify transformed application and release
        env:
          VITE_BASE_PATH: ./
        run: |
          node scripts/validate-webmcp.mjs
          npm run lint
          npm test -- --reporter=verbose
          npm run build
          node scripts/build-standalone.mjs
          node scripts/smoke-standalone.mjs
          git diff --check

      - name: Remove migration machinery and commit verified result
        run: |
          set -euo pipefail
          rm scripts/apply-browser-compatibility.py
          rm .github/workflows/apply-browser-compatibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support current and legacy WebMCP APIs'
          git push origin HEAD:compat-v1.0.2
