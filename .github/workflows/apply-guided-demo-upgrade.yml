name: Apply verified guided-demo upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-guided-demo-upgrade.mjs

permissions:
  contents: write

jobs:
  upgrade:
    name: Patch, verify, and commit the protocol-driven demo
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply deterministic source transformation
        run: node scripts/apply-guided-demo-upgrade.mjs

      - name: Verify transformed source
        run: |
          node scripts/validate-webmcp.mjs
          npm run lint
          npm test -- --reporter=verbose
          npm run build
          git diff --check

      - name: Commit verified source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/App.test.tsx
          git commit -m 'feat: run judge demo through WebMCP tools'
          git push origin HEAD:main
