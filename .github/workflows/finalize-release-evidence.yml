name: Finalize release evidence

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-release-evidence.mjs

permissions:
  contents: write

jobs:
  finalize:
    name: Update, verify, and commit final evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Update release evidence
        run: node scripts/finalize-release-evidence.mjs

      - name: Verify release documentation and application
        run: |
          node scripts/validate-webmcp.mjs
          npm run lint
          npm test -- --reporter=verbose
          VITE_BASE_PATH=./ npm run build
          node scripts/build-standalone.mjs
          node scripts/smoke-standalone.mjs
          git diff --check

      - name: Commit verified evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PLAN.md docs/
          if git diff --cached --quiet; then
            echo 'Release evidence already current.'
            exit 0
          fi
          git commit -m 'docs: synchronize final verification evidence'
          git push origin HEAD:main
