name: Deploy ForkRoom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build the judge artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit WebMCP contract
        run: node scripts/validate-webmcp.mjs

      - name: Lint
        run: npm run lint

      - name: Run deterministic tests
        run: npm test -- --reporter=verbose

      - name: Build path-safe production app
        env:
          VITE_BASE_PATH: /forkroom-webmcp/
        run: npm run build

      - name: Verify built entry points
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -q '/forkroom-webmcp/assets/' dist/index.html
          grep -R -q 'registerTool' dist/assets/*.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish judge-accessible application
    needs: verify-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
